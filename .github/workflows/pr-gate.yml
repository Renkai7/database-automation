# D-04/D-06/D-16 (05-CONTEXT.md): the pull-request gate. At this plan it carries the `analyze`
# job only -- `tamper-checks`, `test`, `test-history`, `migrate`, and `ruleset-config-check` are
# later plans in this phase. The `analyze` job's `name:` is a published contract: plan 05-08
# copies it verbatim into the repository ruleset's required_status_checks list (Pitfall 2,
# 05-RESEARCH.md), so it must never be renamed casually once the ruleset exists.
#
# Plain `pull_request`, never `pull_request_target` (05-RESEARCH.md Pitfall 6, T-05-12): this
# repository has no fork pull requests today, and the elevated fork-token trigger is an
# anti-pattern this phase deliberately declines to reach for.
name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Workflow-level default is read-only (T-05-16); pull-requests: write is granted on the analyze
# job alone, the only job that needs it.
permissions:
  contents: read

# CI-04: two runs of `analyze` for the same pull request can never be posting a comment at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Explicit head-SHA checkout, never the default pull_request merge ref (05-RESEARCH.md
      # Architecture Pattern 3). fetch-depth: 0 is required for scripts/ci/analyze-gate.ts's
      # base/head diff to resolve at all (Pitfall 3).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Settles 05-RESEARCH.md assumption A1 (gh preinstalled on the runner) from the first real
      # run, rather than trusting it.
      - name: Confirm the GitHub CLI is available
        run: gh --version

      - name: Run the analyze gate
        run: pnpm exec tsx scripts/ci/analyze-gate.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # D-09/D-10 (05-CONTEXT.md), CI-05: the two tamper-detection checks. Deliberately no
  # `services:` block -- check-append-only.ts never opens a database connection at all, and
  # check-schema-drift.ts needs RECIPE_DEV_DATABASE_URL only because
  # apps/recipe-app/drizzle.config.ts asserts the pinned target at module-load time (Pitfall 5,
  # 05-RESEARCH.md) -- it never opens a socket either. The value below is a throwaway,
  # per-job container credential guarding nothing that outlives the job (T-05-38, accepted;
  # reviewed and deliberately committed as a non-secret, named so this is obvious in the file
  # itself).
  tamper-checks:
    name: tamper-checks
    runs-on: ubuntu-latest
    env:
      RECIPE_DEV_DATABASE_URL: postgres://recipe_app:ci_ephemeral_not_a_secret@127.0.0.1:5432/recipe_dev
      RECIPE_DEV_DB_PASSWORD: ci_ephemeral_not_a_secret
    steps:
      # fetch-depth: 0 (not the default 1) so PR_BASE_SHA and PR_HEAD_SHA are both resolvable
      # for check-append-only.ts's diff (Pitfall 3, 05-RESEARCH.md) -- a diff that could not be
      # computed must fail this check, never pass silently as an empty one.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert migrations are append-only (files and journal entries) -- D-09/D-10
        run: pnpm exec tsx scripts/ci/check-append-only.ts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Assert schema.ts and the committed migration history agree (no drift) -- D-09
        run: pnpm exec tsx scripts/ci/check-schema-drift.ts

  # CI-01: the application test suite, including tests/smoke.test.ts, which performs a real
  # production build and boots the application. That is exactly why D-14 requires the dedicated
  # `migrate` job below to be a structurally separate job from this one -- the migrate step here
  # is test-fixture setup invoked explicitly by this job's own steps, never the CI-06
  # demonstration, and never an application startup hook (D8, docs/decisions.md).
  #
  # LIVE FINDING (05-06): this job provisions Postgres via `docker compose` (`pnpm db:up`), NOT a
  # GitHub Actions `services:` container -- unlike `migrate` below, which never runs `pnpm test`.
  # `pnpm test` runs `tests/migrate.test.ts` unmodified, which shells out to `pnpm run db:reset`
  # (scripts/db-reset.ts), and that script itself runs `docker compose down -v` then
  # `docker compose up -d --wait` to reset the pinned dev database -- confirmed live: with a
  # `services:` container instead, `docker compose up -d --wait` failed outright because a
  # `services:` container already held port 127.0.0.1:5432, and `tests/migrate.test.ts` failed
  # its very first assertion (`resetRun.exitCode` was 1, not 0). Matching `restore-drill.yml`'s
  # already-proven docker-compose provisioning here lets the unmodified suite run exactly as it
  # does locally, rather than inventing a second, incompatible database-lifecycle mechanism.
  test:
    name: test
    runs-on: ubuntu-latest
    # Rule 2 defensive addition (05-06): a hung `next start` process (see the tests/smoke.test.ts
    # fix in this same commit) could otherwise run until GitHub's own default 6-hour job ceiling,
    # burning the repository's Actions minutes silently. 15 minutes is generous over the ~1
    # minute local baseline for the full 531-test suite including the production build.
    timeout-minutes: 15
    env:
      RECIPE_DEV_DATABASE_URL: postgres://recipe_app:ci_ephemeral_not_a_secret@127.0.0.1:5432/recipe_dev
      RECIPE_DEV_DB_PASSWORD: ci_ephemeral_not_a_secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the local development database (docker compose)
        run: pnpm db:up

      - name: Apply migrations (test-fixture setup, not the CI-06 demonstration -- see the migrate job)
        run: pnpm db:migrate

      - name: Seed the database
        run: pnpm db:seed

      - name: Run the application test suite
        run: pnpm test

  # CI-01: both migration history test axes (empty-database full history, existing-database
  # newest-only), unmodified from Phase 4. No `services:` block -- the suite starts its own
  # ephemeral postgres:17 Testcontainers per test file; Docker is available on the runner by
  # default.
  #
  # LIVE FINDING (05-06): this job still needs RECIPE_DEV_DATABASE_URL even though it opens no
  # socket against it -- the same Pitfall 5 shape as check-schema-drift.ts, one level removed.
  # tests/history/support.ts imports scripts/env.ts (for EXPECTED_DEV_DATABASE_NAME), and that
  # import triggers scripts/env.ts's own module-load-time EnvSchema.parse(process.env) before a
  # single test runs -- confirmed live (a real CI run failed every test file with "RECIPE_DEV_
  # DATABASE_URL is missing or malformed" before this env block was added, not a test failure).
  test-history:
    name: test-history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RECIPE_DEV_DATABASE_URL: postgres://recipe_app:ci_ephemeral_not_a_secret@127.0.0.1:5432/recipe_dev
      RECIPE_DEV_DB_PASSWORD: ci_ephemeral_not_a_secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run both migration history test axes (empty-database, existing-database)
        run: pnpm test:history

  # D-05 (05-CONTEXT.md), CI-03: continuously re-verifies the live ruleset's own configuration --
  # the runner does not trust that it applied its own migrations, it re-queries and refuses if
  # the state does not read back as expected; this check applies the identical scepticism to the
  # ruleset one layer up. Its honest limit, stated here and in every failure message this check
  # emits: it runs INSIDE the thing it audits. Someone who can edit the ruleset can also delete
  # this check. It raises the cost of tampering and makes it visible; it does not make tampering
  # impossible (docs/decisions.md D12).
  #
  # LIVE FINDING (05-06, superseding 05-RESEARCH.md's assumption): `administration` is not a
  # recognized key in a workflow's `permissions:` block at all -- confirmed against the real
  # GitHub API (`gh workflow run` on a scratch trigger returned "HTTP 422: Invalid Argument -
  # failed to parse workflow: Unexpected value 'administration'"), not merely "insufficient".
  # `GITHUB_TOKEN` cannot be granted repository-administration scope through this declarative
  # block at all, by any value. This job therefore runs with only the workflow-level default
  # (contents: read) -- no elevated permission is requested here, because none is grantable.
  # check-ruleset-config.ts's own `assertBypassListEmpty` already fails CLOSED (not silently
  # passes) when `bypass_actors` is absent from the API response, which is exactly what this
  # token will observe. This is a genuine, unresolved phase-blocking finding for plan 05-08 (the
  # plan that applies the ruleset and first has a real one to query) -- 05-RESEARCH.md's own open
  # question #1 pre-committed "absent" as one of three possible outcomes requiring a design change
  # (most likely a fine-grained PAT or GitHub App token with real admin rights, held as a
  # repository secret); it is now confirmed live rather than left a research-time guess.
  ruleset-config-check:
    name: ruleset-config-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert the live ruleset has an empty bypass list, active enforcement, and every required check
        run: pnpm exec tsx scripts/ci/check-ruleset-config.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # D-14 (05-CONTEXT.md), CI-06: migrations run as their own, structurally separate pipeline
  # step -- invoked BY the pipeline, and nothing in the application's own startup path triggers
  # them (docs/decisions.md D8; tests/guardrails.test.ts mechanically enforces the second half of
  # that claim, plan 05-07). This job's entire body, after the shared preamble, is a single step
  # running the real `pnpm db:migrate` entry point (scripts/db-migrate.ts) unmodified -- no
  # build, no seed, no test, no application boot. With the database reachable at
  # 127.0.0.1:5432/recipe_dev, assertLocalDevelopmentTarget's pin (host/port/database name) is
  # satisfied honestly and scripts/env.ts is never loosened to fit CI.
  migrate:
    name: migrate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: recipe_app
          POSTGRES_PASSWORD: ci_ephemeral_not_a_secret
          POSTGRES_DB: recipe_dev
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_app -d recipe_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RECIPE_DEV_DATABASE_URL: postgres://recipe_app:ci_ephemeral_not_a_secret@127.0.0.1:5432/recipe_dev
      RECIPE_DEV_DB_PASSWORD: ci_ephemeral_not_a_secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations -- the CI-06 demonstration
        run: pnpm db:migrate
